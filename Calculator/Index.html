<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Index.css">
    <title>Calculator</title>
</head>

<body>
    <from class="cals">
        <div class="form-group">
            <input type="text" placeholder="00">
        </div>
        <div class="form-group">
            <button type="button" onclick="cals('%')">%</button>
            <button type="button" onclick="calsclear()">c</button>
            <button type="button" onclick="calsdel()">Del</button>
            <button type="button" onclick="cals('/')">/</button>
        </div>
        <div class="form-group">
            <button type="button" onclick="cals('1')">1</button>
            <button type="button" onclick="cals('2')">2</button>
            <button type="button" onclick="cals('3')">3</button>
            <button type="button" onclick="cals('+')">+</button>
        </div>
        <div class="form-group">
            <button type="button" onclick="cals('4')">4</button>
            <button type="button" onclick="cals('5')">5</button>
            <button type="button" onclick="cals('6')">6</button>
            <button type="button" onclick="cals('-')">-</button>
        </div>
        <div class="form-group">
            <button type="button" onclick="cals('7')">7</button>
            <button type="button" onclick="cals('8')">8</button>
            <button type="button" onclick="cals('9')">9</button>
            <button type="button" onclick="cals('*')">*</button>
        </div>
        <div class="form-group">
            <button type="button" onclick="cals('00')">00</button>
            <button type="button" onclick="cals('0')">0</button>
            <button type="button" onclick="cals('.')"><b>.</b></button>
            <button type="button" class="equal" onclick="calseql()">=</button>
        </div>
    </from>
    <script src="Index.js"></script>
</body>
</html>
